services:
  - type: web
    name: bizpilot-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      # Qiymatlar Render dashboard'da kiritiladi (repoga yozilmaydi)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_ADMIN_TELEGRAM
        sync: false
      - key: NEXT_PUBLIC_TELEGRAM_BOT_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # SEO: o'z domeningiz bo'lsa (masalan https://studyra.uz) va Google Search Console tasdiqlash kodi
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
        sync: false
      # Admin panel (/admin) uchun login va parol
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Obuna to'lovlari (Payme va Octo karta)
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: PAYME_TEST
        sync: false
      - key: OCTO_SHOP_ID
        sync: false
      - key: OCTO_SECRET
        sync: false
      - key: OCTO_UNIQUE_KEY
        sync: false
      - key: OCTO_TEST
        sync: false
