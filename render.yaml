services:
  - type: web
    name: bizpilot-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      # Qiymatlar Render dashboard'da kiritiladi (repoga yozilmaydi)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEXT_PUBLIC_ADMIN_TELEGRAM
        sync: false
      - key: NEXT_PUBLIC_TELEGRAM_BOT_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SMS_HOOK_SECRET
        sync: false
      - key: ESKIZ_EMAIL
        sync: false
      - key: ESKIZ_PASSWORD
        sync: false
      - key: ESKIZ_FROM
        sync: false
      - key: ESKIZ_TEMPLATE
        sync: false
